name: collecte

services:
  postgres:
    image: postgres:16-alpine
    container_name: collecte-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-collecte}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-collecte_secret}
      POSTGRES_DB: ${POSTGRES_DB:-collecte_ecole}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - collecte_internal
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-collecte} -d $${POSTGRES_DB:-collecte_ecole}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: collecte-server
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://${POSTGRES_USER:-collecte}:${POSTGRES_PASSWORD:-collecte_secret}@postgres:5432/${POSTGRES_DB:-collecte_ecole}?schema=public
      APP_BASE_URL: ${APP_BASE_URL:-}
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET est requis dans .env}
      SUPERADMIN_EMAIL: ${SUPERADMIN_EMAIL:-denis.safieddine@gmail.com}
      SUPERADMIN_PASSWORD: ${SUPERADMIN_PASSWORD:?SUPERADMIN_PASSWORD est requis dans .env}
      SUPERADMIN_NAME: ${SUPERADMIN_NAME:-Denis Safieddine}
      GEOCODING_PROVIDER: ${GEOCODING_PROVIDER:-photon}
      PHOTON_BASE_URL: ${PHOTON_BASE_URL:-https://photon.komoot.io}
      MAPBOX_ACCESS_TOKEN: ${MAPBOX_ACCESS_TOKEN:-}
      GOOGLE_PLACES_API_KEY: ${GOOGLE_PLACES_API_KEY:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-Collecte École}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-collecte@ecole.local}
      SMTP_DRY_RUN: ${SMTP_DRY_RUN:-true}
    networks:
      - collecte_internal
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:4000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: collecte-client
    restart: unless-stopped
    depends_on:
      server:
        condition: service_healthy
    ports:
      - "${APP_PORT:-3040}:80"
    networks:
      - collecte_internal
    security_opt:
      - no-new-privileges:true

networks:
  collecte_internal:
    name: collecte_internal
    driver: bridge

volumes:
  postgres_data:
