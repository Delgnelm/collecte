services:
  postgres:
    image: postgres:16-alpine
    container_name: collecte-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-collecte}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-collecte_secret}
      POSTGRES_DB: ${POSTGRES_DB:-collecte_ecole}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-collecte} -d ${POSTGRES_DB:-collecte_ecole}"]
      interval: 5s
      timeout: 5s
      retries: 10

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: collecte-server
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://${POSTGRES_USER:-collecte}:${POSTGRES_PASSWORD:-collecte_secret}@postgres:5432/${POSTGRES_DB:-collecte_ecole}?schema=public
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:8080}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:8080}
      JWT_SECRET: ${JWT_SECRET:-change-me-to-a-long-random-secret-at-least-32-chars}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@ecole.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-ChangeMe2026!}
      ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH:-}
      GEOCODING_PROVIDER: ${GEOCODING_PROVIDER:-photon}
      PHOTON_BASE_URL: ${PHOTON_BASE_URL:-https://photon.komoot.io}
      MAPBOX_ACCESS_TOKEN: ${MAPBOX_ACCESS_TOKEN:-}
      GOOGLE_PLACES_API_KEY: ${GOOGLE_PLACES_API_KEY:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-Collecte École}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-collecte@ecole.local}
      SMTP_DRY_RUN: ${SMTP_DRY_RUN:-true}
    ports:
      - "4000:4000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:4000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: collecte-client
    restart: unless-stopped
    depends_on:
      server:
        condition: service_healthy
    ports:
      - "8080:80"

volumes:
  postgres_data:
